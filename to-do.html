<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — a daily task planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page-1: #c8c5e3;
    --page-2: #dbd8ee;

    --navy-900: #1a1830;
    --navy-800: #242047;
    --navy-700: #322c58;
    --navy-600: #3d3768;

    --surface: #f5f3fb;
    --surface-white: #ffffff;
    --line: rgba(33, 29, 61, 0.08);
    --line-dark: rgba(245, 243, 251, 0.10);

    --ink-dark: #211d3d;
    --ink-dim: #726d92;
    --ink-faint: #a29dc0;
    --ink-light: #f5f3fb;
    --ink-light-dim: rgba(245, 243, 251, 0.60);

    --blue: #4a6cf7;
    --blue-bright: #6f8bff;
    --teal: #2f9e8f;
    --gold: #f0a63d;
    --coral: #ef6f6f;
    --purple: #8b6ef2;

    --font-body: 'Manrope', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 700px 500px at 15% 0%, rgba(255,255,255,0.5), transparent 60%),
      linear-gradient(160deg, var(--page-1) 0%, var(--page-2) 100%);
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 56px 20px 60px;
  }

  .shell {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 40px 80px -24px rgba(26, 24, 48, 0.35), 0 0 0 1px rgba(255,255,255,0.4);
    position: relative;
  }

  /* ================= DARK HERO ================= */

  .hero {
    background: linear-gradient(160deg, var(--navy-900) 0%, var(--navy-700) 100%);
    padding: 28px 26px 64px;
    position: relative;
    color: var(--ink-light);
  }

  .hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 800;
    font-size: 15.5px;
    letter-spacing: 0.01em;
  }

  .brand .mark {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--blue), var(--blue-bright));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero-icons {
    display: flex;
    gap: 8px;
  }

  .hero-icons .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: rgba(245,243,251,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-light-dim);
  }

  .greeting {
    margin-bottom: 18px;
  }

  .greeting .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--blue-bright);
    display: block;
    margin-bottom: 6px;
  }

  .greeting h1 {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  /* Composer — styled like the search bar in reference */

  .composer {
    background: rgba(245,243,251,0.08);
    border: 1px solid rgba(245,243,251,0.10);
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }

  .composer-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .composer-row svg { flex-shrink: 0; opacity: 0.55; }

  #task-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink-light);
    font-family: var(--font-body);
    font-size: 14.5px;
    font-weight: 500;
  }

  #task-input::placeholder { color: var(--ink-light-dim); }

  .add-btn {
    background: var(--blue);
    border: none;
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    flex-shrink: 0;
  }

  .add-btn:hover { background: var(--blue-bright); }
  .add-btn:active { transform: scale(0.94); }

  .composer-meta {
    display: flex;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid rgba(245,243,251,0.08);
  }

  .priority-pick {
    display: flex;
    gap: 6px;
    flex: 1;
  }

  .priority-pick button {
    flex: 1;
    background: rgba(245,243,251,0.06);
    border: 1px solid transparent;
    color: var(--ink-light-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 7px 0;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all 0.15s ease;
  }

  .priority-pick button .dot { width: 6px; height: 6px; border-radius: 50%; }
  .priority-pick button[data-p="high"] .dot { background: var(--coral); }
  .priority-pick button[data-p="medium"] .dot { background: var(--gold); }
  .priority-pick button[data-p="low"] .dot { background: var(--teal); }

  .priority-pick button.active {
    background: rgba(245,243,251,0.12);
    border-color: rgba(245,243,251,0.18);
    color: var(--ink-light);
  }

  #category-input {
    width: 108px;
    background: rgba(245,243,251,0.06);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 0 10px;
    color: var(--ink-light);
    font-family: var(--font-mono);
    font-size: 11px;
    outline: none;
  }

  #category-input::placeholder { color: var(--ink-light-dim); }
  #category-input:focus { border-color: rgba(245,243,251,0.18); }

  /* Progress card — echoes the "MyDocs / storage bar" card */

  .progress-card {
    background: rgba(245,243,251,0.07);
    border: 1px solid rgba(245,243,251,0.10);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .progress-card .p-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--blue), var(--blue-bright));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .progress-card .p-body { flex: 1; min-width: 0; }

  .progress-card .p-title {
    font-weight: 700;
    font-size: 14.5px;
    margin-bottom: 2px;
  }

  .progress-card .p-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-light-dim);
    margin-bottom: 9px;
  }

  .p-track {
    height: 5px;
    background: rgba(245,243,251,0.12);
    border-radius: 4px;
    overflow: hidden;
  }

  .p-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--blue-bright));
    border-radius: 4px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  }

  /* Wave divider */

  .wave {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    line-height: 0;
  }

  .wave svg { display: block; width: 100%; height: 48px; }

  /* ================= LIGHT BODY ================= */

  .body-light {
    background: var(--surface);
    padding: 20px 22px 8px;
  }

  /* Category quick filters — colorful squircle icons like the folder grid */

  .quick-filters {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .qf-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--font-body);
  }

  .qf-icon {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 14px -6px rgba(33,29,61,0.18);
  }

  .qf-item.active .qf-icon { transform: translateY(-2px); box-shadow: 0 10px 18px -6px rgba(33,29,61,0.28); }

  .qf-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-dim);
  }

  .qf-item.active .qf-label { color: var(--ink-dark); }

  /* Section head */

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .section-head h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-dark);
  }

  .clear-done {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .clear-done:hover { color: var(--ink-dim); }

  /* Task rows — file-row styled */

  .task-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 60px;
  }

  .task {
    background: var(--surface-white);
    border-radius: 16px;
    padding: 11px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 14px -8px rgba(33,29,61,0.12);
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-dark);
    word-break: break-word;
    transition: color 0.2s ease;
  }

  .task.done .task-text {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
  }

  .task-sub {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-faint);
    margin-top: 2px;
    display: flex;
    gap: 8px;
  }

  .check-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid #e4e1f2;
    background: var(--surface-white);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .check-btn svg {
    opacity: 0;
    transform: scale(0.5);
  }

  .task.done .check-btn {
    background: linear-gradient(135deg, var(--blue), var(--blue-bright));
    border-color: transparent;
  }

  .task.done .check-btn svg {
    opacity: 1;
    animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes pop-in {
    0% { opacity: 0; transform: scale(1.6); }
    60% { opacity: 1; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    flex-shrink: 0;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .delete-btn:hover { color: var(--coral); background: #f7f0f0; }

  /* Empty state */

  .empty-state {
    text-align: center;
    padding: 40px 20px 30px;
    color: var(--ink-faint);
  }

  .empty-state svg { margin: 0 auto 14px; }

  .empty-state p {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink-dim);
    margin-bottom: 4px;
  }

  .empty-state span {
    font-family: var(--font-mono);
    font-size: 11.5px;
  }

  /* Bottom nav */

  .bottom-nav {
    margin-top: 18px;
    padding: 14px 22px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--line);
  }

  .nav-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .nav-btn.active { color: var(--blue); }

  .nav-center {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--blue-bright));
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 20px -6px rgba(74,108,247,0.55);
    border: none;
    margin-top: -34px;
    transition: transform 0.15s ease;
  }

  .nav-center:hover { transform: translateY(-2px); }

  /* Responsive */

  @media (max-width: 460px) {
    body { padding: 30px 12px 40px; }
    .shell { border-radius: 28px; }
    .hero { padding: 22px 18px 56px; }
    .body-light { padding: 18px 16px 8px; }
  }
</style>
</head>
<body>

<div class="shell">

  <div class="hero">
    <div class="hero-top">
      <div class="brand">
        <span class="mark">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5 11-11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Ledger
      </div>
      <div class="hero-icons">
        <span class="icon-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="icon-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
      </div>
    </div>

    <div class="greeting">
      <span class="eyebrow" id="today-date"></span>
      <h1>Today's list</h1>
    </div>

    <div class="composer">
      <div class="composer-row">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" id="task-input" placeholder="Add a task and hit Enter…" maxlength="140">
        <button class="add-btn" id="add-btn" aria-label="Add task">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="composer-meta">
        <div class="priority-pick" id="priority-pick">
          <button data-p="low" class="active"><span class="dot"></span>Low</button>
          <button data-p="medium"><span class="dot"></span>Med</button>
          <button data-p="high"><span class="dot"></span>High</button>
        </div>
        <input type="text" id="category-input" placeholder="category">
      </div>
    </div>

    <div class="progress-card">
      <div class="p-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="p-body">
        <div class="p-title" id="progress-title">0 of 0 done</div>
        <div class="p-sub" id="progress-sub">0% complete</div>
        <div class="p-track"><div class="p-fill" id="p-fill" style="width:0%"></div></div>
      </div>
    </div>

    <div class="wave">
      <svg viewBox="0 0 420 48" preserveAspectRatio="none">
        <path d="M0,20 C 80,45 140,0 210,14 C 280,28 340,4 420,18 L420,48 L0,48 Z" fill="#f5f3fb"/>
      </svg>
    </div>
  </div>

  <div class="body-light">
    <div class="quick-filters" id="filter-tabs">
      <button class="qf-item active" data-f="all">
        <span class="qf-icon" style="background: linear-gradient(135deg,#8b6ef2,#a98bf7);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="2" fill="#fff"/><rect x="13" y="4" width="7" height="7" rx="2" fill="#fff" opacity="0.7"/><rect x="4" y="13" width="7" height="7" rx="2" fill="#fff" opacity="0.7"/><rect x="13" y="13" width="7" height="7" rx="2" fill="#fff" opacity="0.5"/></svg>
        </span>
        <span class="qf-label">All</span>
      </button>
      <button class="qf-item" data-f="active">
        <span class="qf-icon" style="background: linear-gradient(135deg,#f0a63d,#f5bd6b);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#fff" stroke-width="2"/><path d="M12 8v4l3 2" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="qf-label">Active</span>
      </button>
      <button class="qf-item" data-f="done">
        <span class="qf-icon" style="background: linear-gradient(135deg,#2f9e8f,#4dbeae);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5 11-11" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="qf-label">Done</span>
      </button>
      <button class="qf-item" data-f="high">
        <span class="qf-icon" style="background: linear-gradient(135deg,#ef6f6f,#f39a9a);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.8 5.6H20l-4.7 3.4 1.8 5.6L12 14.2l-5.1 3.4 1.8-5.6L4 8.6h6.2L12 3z" fill="#fff"/></svg>
        </span>
        <span class="qf-label">High</span>
      </button>
    </div>

    <div class="section-head">
      <h2 id="list-title">Your tasks</h2>
      <button class="clear-done" id="clear-done">Clear completed</button>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <div class="bottom-nav">
      <button class="nav-btn active" id="nav-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Home
      </button>
      <button class="nav-center" id="focus-input" aria-label="Add a task">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <button class="nav-btn" id="nav-clock">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Later
      </button>
    </div>
  </div>

</div>

<script>
(function () {
  const STORAGE_KEY = 'ledger-tasks-v2';
  let tasks = [];
  let filter = 'all';
  let selectedPriority = 'low';

  const ICON_COLORS = {
    low:    { grad: 'linear-gradient(135deg,#2f9e8f,#4dbeae)' },
    medium: { grad: 'linear-gradient(135deg,#f0a63d,#f5bd6b)' },
    high:   { grad: 'linear-gradient(135deg,#ef6f6f,#f39a9a)' },
  };

  const listEl = document.getElementById('task-list');
  const inputEl = document.getElementById('task-input');
  const categoryEl = document.getElementById('category-input');
  const addBtn = document.getElementById('add-btn');
  const filterTabs = document.getElementById('filter-tabs');
  const priorityPick = document.getElementById('priority-pick');
  const clearDoneBtn = document.getElementById('clear-done');
  const pFill = document.getElementById('p-fill');
  const progressTitle = document.getElementById('progress-title');
  const progressSub = document.getElementById('progress-sub');
  const listTitle = document.getElementById('list-title');
  const dateEl = document.getElementById('today-date');
  const focusBtn = document.getElementById('focus-input');

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : seedTasks();
    } catch (e) {
      tasks = seedTasks();
    }
  }

  function seedTasks() {
    return [
      { id: cryptoId(), text: 'Push the portfolio site live', category: 'work', priority: 'high', done: false, time: timeNow() },
      { id: cryptoId(), text: 'Reply to recruiter email', category: 'work', priority: 'medium', done: false, time: timeNow() },
      { id: cryptoId(), text: 'Water the plants', category: 'home', priority: 'low', done: true, time: timeNow() },
    ];
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function cryptoId() { return 't' + Math.random().toString(36).slice(2, 10); }

  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    const visible = tasks.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'done') return t.done;
      if (filter === 'high') return t.priority === 'high';
      return true;
    });

    const titles = { all: 'Your tasks', active: 'Still open', done: 'Completed', high: 'High priority' };
    listTitle.textContent = titles[filter];

    listEl.innerHTML = '';

    if (visible.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
            <rect x="6" y="6" width="28" height="28" rx="9" fill="#eeecf9"/>
            <path d="M14 20l4 4 8-9" stroke="#a29dc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p>${filter === 'done' ? 'Nothing finished yet' : filter === 'active' ? 'All clear' : filter === 'high' ? 'No high-priority tasks' : 'Your list is empty'}</p>
          <span>${filter === 'active' ? 'every task is done — nice work' : 'add your first task above'}</span>
        </div>`;
    } else {
      visible.forEach(t => {
        const li = document.createElement('li');
        li.className = `task${t.done ? ' done' : ''}`;
        const grad = ICON_COLORS[t.priority].grad;
        li.innerHTML = `
          <div class="task-icon" style="background:${grad}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 4h9l3 3v13a1 1 0 01-1 1H6a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </div>
          <div class="task-body">
            <div class="task-text">${escapeHtml(t.text)}</div>
            <div class="task-sub">
              ${t.category ? `<span>${escapeHtml(t.category)}</span>` : ''}
              <span>${t.time}</span>
            </div>
          </div>
          <button class="check-btn" data-id="${t.id}" role="checkbox" aria-checked="${t.done}" tabindex="0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5 11-11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="delete-btn" data-id="${t.id}" aria-label="Delete task">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>`;
        listEl.appendChild(li);
      });
    }

    updateProgress();
  }

  function updateProgress() {
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
    pFill.style.width = pct + '%';
    progressTitle.textContent = `${done} of ${total} done`;
    progressSub.textContent = `${pct}% complete`;
  }

  function addTask() {
    const text = inputEl.value.trim();
    if (!text) return;
    tasks.unshift({
      id: cryptoId(),
      text,
      category: categoryEl.value.trim(),
      priority: selectedPriority,
      done: false,
      time: timeNow(),
    });
    inputEl.value = '';
    categoryEl.value = '';
    save();
    render();
    inputEl.focus();
  }

  addBtn.addEventListener('click', addTask);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  categoryEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  focusBtn.addEventListener('click', () => inputEl.focus());

  priorityPick.addEventListener('click', e => {
    const btn = e.target.closest('button[data-p]');
    if (!btn) return;
    selectedPriority = btn.dataset.p;
    priorityPick.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });

  filterTabs.addEventListener('click', e => {
    const btn = e.target.closest('button[data-f]');
    if (!btn) return;
    filter = btn.dataset.f;
    filterTabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });

  clearDoneBtn.addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  });

  listEl.addEventListener('click', e => {
    const checkBtn = e.target.closest('.check-btn');
    if (checkBtn) {
      const id = checkBtn.dataset.id;
      const t = tasks.find(x => x.id === id);
      if (t) { t.done = !t.done; save(); render(); }
      return;
    }
    const delBtn = e.target.closest('.delete-btn');
    if (delBtn) {
      const id = delBtn.dataset.id;
      tasks = tasks.filter(x => x.id !== id);
      save();
      render();
    }
  });

  listEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      const checkBtn = e.target.closest('.check-btn');
      if (checkBtn) {
        e.preventDefault();
        const id = checkBtn.dataset.id;
        const t = tasks.find(x => x.id === id);
        if (t) { t.done = !t.done; save(); render(); }
      }
    }
  });

  dateEl.textContent = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

  load();
  render();
})();
</script>

</body>
</html>
